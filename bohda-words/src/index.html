<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bodha Words | BodhaPlay</title>

    <!-- ==============================
         Bodha Words Game Styling
    ============================== -->
    <link
        rel="stylesheet"
        href="/src/style.css"
    >

    <!-- ==============================
         Original Zat.am Navbar Styling
    ============================== -->
    

    <!-- ==============================
         Game Dependencies
    ============================== -->
    <script src="https://unpkg.com/papaparse@5.7.0/papaparse.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.2.8/sanscript.js"></script>

    <link rel="stylesheet" href="/shared/navbar.css">
    <link rel="stylesheet" href="/bp26/css/header.css">
</head>

<body>

    <!-- ==============================
         Shared Navbar Placeholder
    ============================== -->
    <div id="header-placeholder"></div>

    <!-- ==============================
         BODHA WORDS NAVIGATION FIX
         Only affects this game
    ============================== -->
    <script>
        document.addEventListener("click", function (event) {

            const navbar = document.getElementById(
                "header-placeholder"
            );

            if (!navbar || !navbar.contains(event.target)) {
                return;
            }

            const clickedElement = event.target.closest(
                ".zatam-logo, [data-nav-page='contest'], #navbar-login-btn"
            );

            if (!clickedElement) {
                return;
            }

            let destination = null;

            // ==============================
            // Logo -> BP26 Competition
            // ==============================
            if (clickedElement.matches(".zatam-logo")) {
                destination = "https://zat.am/bp26/index.html";
            }

            // ==============================
            // Contest -> BP26 Competition
            // ==============================
            else if (
                clickedElement.matches("[data-nav-page='contest']")
            ) {
                destination = "https://zat.am/bp26/index.html";
            }

            // ==============================
            // Login -> Zat.am Authentication
            // ==============================
            else if (
                clickedElement.matches("#navbar-login-btn")
            ) {
                const loginUrl = new URL(
                    "/auth/login.html",
                    "https://zat.am"
                );

                // Return to the current game after login
                loginUrl.searchParams.set(
                    "redirect",
                    window.location.href
                );

                destination = loginUrl.href;
            }

            // ==============================
            // Navigate
            // ==============================
            if (destination) {
                event.preventDefault();
                event.stopImmediatePropagation();

                window.location.assign(destination);
            }

        }, true);
    </script>

    <!-- ==============================
         Shared BodhaPlay Navbar Loader
    ============================== -->
    <script
        type="module"
        src="/bp26/js/load-header.js"
    ></script>

    <!-- ==============================
         Bodha Words Game
    ============================== -->
    <script
        type="module"
        src="../hooks/script.js"
    ></script>

</body>
</html>
